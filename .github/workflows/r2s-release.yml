name: Build R2S Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (optional)"
        required: false
      release_name:
        description: "Release name (optional)"
        required: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare cache directories
        run: |
          mkdir -p dl .ccache build_dir staging_dir

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
            build_dir
            staging_dir
          key: ${{ runner.os }}-r2s-${{ hashFiles('defconfigs/opir2s_defconfig', 'feeds.conf.default') }}-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-r2s-${{ hashFiles('defconfigs/opir2s_defconfig', 'feeds.conf.default') }}-
            ${{ runner.os }}-r2s-
          save-always: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget libelf-dev ccache

      - name: Setup ccache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
        run: |
          ccache -M "$CCACHE_MAXSIZE"
          ccache -s

      - name: Debug - Show uboot-ky Makefile
        run: |
          echo "=== package/boot/uboot-ky/Makefile ==="
          cat package/boot/uboot-ky/Makefile
          echo ""
          echo "=== Checking git status ==="
          git log --oneline -3
          git status

      - name: Build firmware
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
        run: |
          ./build.sh all r2s || {
            echo "=== Build failed, showing uboot-ky build log ==="
            find build_dir -name "*.log" -path "*uboot*" -exec echo "--- {} ---" \; -exec tail -100 {} \; 2>/dev/null || true
            echo "=== Trying to rebuild uboot-ky with V=s ==="
            make package/boot/uboot-ky/compile V=s 2>&1 | tail -200
            exit 1
          }

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          OUTPUT_DIR="bin/targets/ky/riscv64"
          RELEASE_DIR="release"
          mkdir -p "$RELEASE_DIR"
          ls -al "$OUTPUT_DIR"
          cp -v "$OUTPUT_DIR"/*.img* "$RELEASE_DIR"/
          cp -v "$OUTPUT_DIR"/sha256sums "$RELEASE_DIR"/

      - name: Prepare release metadata
        id: meta
        env:
          TAG_INPUT: ${{ github.event.inputs.release_tag }}
          NAME_INPUT: ${{ github.event.inputs.release_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          DATE=$(date +%Y%m%d)
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG="r2s-${DATE}-${RUN_NUMBER}"
          fi
          if [ -n "$NAME_INPUT" ]; then
            NAME="$NAME_INPUT"
          else
            NAME="R2S ${DATE} #${RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
